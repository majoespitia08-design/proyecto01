<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register · English Panda Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/pages.css">
</head>
<body>
<main class="auth-wrap">
  <form class="auth-card" data-auth="register" autocomplete="on">
    <h1>Join the panda!</h1>
    <p>Create your account to save your XP and appear in the ranking.</p>
    <label>Username
      <input name="username" type="text" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username" required>
    </label>
    <label>Password
      <input name="password" type="password" minlength="6" autocomplete="new-password" required>
    </label>
    <label>Repeat password
      <input name="password2" type="password" minlength="6" autocomplete="new-password" required>
    </label>
    <p class="auth-msg" role="alert"></p>
    <button class="auth-btn" type="submit">REGISTER</button>
    <p class="auth-alt">Already have an account? <a href="/login">Log in</a> · <a href="/">Home</a></p>
  </form>
</main>
<script src="/static/js/auth.js"></script>
</body>
</html>
